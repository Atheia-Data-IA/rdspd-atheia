name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & tests (Python ${{ matrix.python-version }})
    # Image epinglee : ubuntu-latest bascule sur Ubuntu 26 le 19/10/2026. On choisit
    # la montee de version explicitement plutot que de la subir sur un run de routine.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        run: pytest -q

      - name: End-to-end smoke run
        run: rdspd-simulate --n-contracts 300 --end 2006-12-31 --version CI
