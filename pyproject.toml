[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rdspd-core"
version = "1.3.0"
description = "Synthetic retail credit portfolio simulator: origination, monthly snapshots, PD scorecards and validation controls"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Atheia" }]
keywords = [
    "credit-risk",
    "probability-of-default",
    "scorecard",
    "monte-carlo",
    "synthetic-data",
    "simulation",
    "ifrs9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "python-dateutil>=2.8",
    "tqdm>=4.65",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/Atheia/rdspd-core"
Repository = "https://github.com/Atheia/rdspd-core"
Issues = "https://github.com/Atheia/rdspd-core/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
rdspd-simulate = "rdspd_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rdspd_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
